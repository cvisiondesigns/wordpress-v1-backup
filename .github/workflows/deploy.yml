name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, feature/static-migration ] # Adjust to your primary branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'astro-rebuild/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: astro-rebuild

      - name: Build Astro
        run: npm run build
        working-directory: astro-rebuild

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-rebuild/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
